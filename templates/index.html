<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informe de Actividades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="mode-day">
  <div class="workspace">
    <aside class="editor">
      <header class="top">
        <img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="DGEHM" />
        <div>
          <h1>Informe de Actividades</h1>
          <p class="subtitle" id="week-range">Cargando semana…</p>
        </div>
      </header>

      <div class="toolbar">
        <div class="mode-toggle" role="tablist" aria-label="Vista">
          <button type="button" id="btn-mode-day" class="mode-btn is-active" aria-pressed="true">Día</button>
          <button type="button" id="btn-mode-week" class="mode-btn" aria-pressed="false">Semana</button>
        </div>
        <div class="week-controls">
          <label class="field inline">
            <span>Año</span>
            <input id="year" type="number" min="2000" max="2100" value="{{ year }}" />
          </label>
          <label class="field inline">
            <span>Semana</span>
            <input id="week" type="number" min="1" max="53" value="{{ week }}" />
          </label>
          <button type="button" id="btn-prev-week" class="btn ghost" title="Semana anterior">←</button>
          <button type="button" id="btn-next-week" class="btn ghost" title="Semana siguiente">→</button>
        </div>
      </div>

      <div class="editor-scroll">
        <section class="panel compact">
          <div class="grid-2">
            <label class="field">
              <span>Nombre</span>
              <input id="nombre" type="text" value="{{ defaults.nombre }}" autocomplete="name" />
            </label>
            <label class="field">
              <span>Cargo</span>
              <input id="cargo" type="text" value="{{ defaults.cargo }}" />
            </label>
          </div>
          <label class="field tight">
            <span>Unidad</span>
            <input id="unidad" type="text" value="{{ defaults.unidad }}" />
          </label>
        </section>

        <section id="view-day" class="panel day-view">
          <div class="section-head">
            <h2 id="day-title">Actividades del día</h2>
            <span class="chip" id="filled-count">0 días con actividades</span>
          </div>
          <div id="day-tabs" class="day-tabs" role="tablist" aria-label="Días de la semana"></div>
          <p class="hint">Una actividad por línea. No hace falta poner <code>--</code>.</p>
          <textarea id="day-editor" autocomplete="off" placeholder="Escribe las actividades de este día…"></textarea>
        </section>

        <section id="view-week" class="panel week-view">
          <div class="section-head">
            <h2>Actividades por día</h2>
            <span class="chip" id="filled-count-week">0 días con actividades</span>
          </div>
          <p class="hint">Una actividad por línea. No hace falta poner <code>--</code>.</p>
          <div id="days" class="days"></div>
        </section>

        <details class="panel extras">
          <summary>Otras secciones del informe</summary>
          <label class="field">
            <span>1) Cumplimiento e instrucciones</span>
            <textarea id="cumplimiento" rows="3" autocomplete="off" placeholder="Ej. Entrega de módulo de reportes"></textarea>
          </label>
          <label class="field">
            <span>3) Proyecciones siguiente semana</span>
            <textarea id="proyecciones" rows="3" autocomplete="off" placeholder="Ej. Continuar calibración de equipos"></textarea>
          </label>
          <label class="field">
            <span>4) Observaciones</span>
            <textarea id="observaciones" rows="3" autocomplete="off" placeholder="Notas relevantes de la semana"></textarea>
          </label>
        </details>
      </div>

      <footer class="actions">
        <button type="button" id="btn-export" class="btn ghost">Exportar JSON</button>
        <button type="button" id="btn-import" class="btn ghost">Importar JSON</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
        <button type="button" id="btn-clear-days" class="btn ghost">Limpiar semana</button>
        <button type="button" id="btn-download" class="btn primary">Descargar PDF</button>
      </footer>
    </aside>

    <section class="preview-pane">
      <span id="preview-status" class="preview-status" hidden></span>
      <div class="preview-stage">
        <img id="preview-a" class="preview-img" alt="Vista previa del informe" />
        <img id="preview-b" class="preview-img" alt="" />
      </div>
    </section>
  </div>

  <script>
    window.__INITIAL__ = {
      year: {{ year }},
      week: {{ week }},
      day: {{ day|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
