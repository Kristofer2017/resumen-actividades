services:
  bitacora:
    build: .
    image: bitacora:local
    container_name: bitacora
    ports:
      - "5050:5050"
    volumes:
      - .:/app
    environment:
      FONT_DIR: /usr/share/fonts/truetype/msttcorefonts
      PYTHONUNBUFFERED: "1"
      TZ: America/El_Salvador
    restart: always
